<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="block1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="block2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Big rounded background for iOS style icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Base grid suggesting "time blocks" -->
  <rect x="120" y="120" width="120" height="120" rx="32" fill="#c7d2fe" fill-opacity="0.4" />
  <rect x="272" y="120" width="120" height="120" rx="32" fill="#c7d2fe" fill-opacity="0.4" />
  <rect x="120" y="272" width="120" height="120" rx="32" fill="#c7d2fe" fill-opacity="0.4" />
  
  <!-- Active completed block (check) -->
  <rect x="272" y="272" width="120" height="120" rx="32" fill="url(#block1)" filter="url(#shadow2)" />
  <path d="M300 332 L320 352 L360 304" fill="none" stroke="#4f46e5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Active playing block floating forward -->
  <rect x="160" y="160" width="192" height="192" rx="48" fill="url(#block2)" filter="url(#shadow1)" />
  <path d="M230 220 L294 256 L230 292 Z" fill="#ffffff" />
</svg>
